name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compiler:
    name: typecheck · tests · verify gates · corpus · roundtrip · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Legacy parity (canonical vs legacy oracle)
        run: pnpm verify:legacy-parity

      - name: Corpus migration (nonzero canonical nodes)
        run: pnpm verify:corpus-migration

      - name: Semantic-loss honesty (losses ⟺ not complete)
        run: pnpm verify:semantic-loss

      - name: Capability consistency (manifest is authoritative)
        run: pnpm verify:capabilities

      - name: Corpus harness
        run: pnpm test:corpus

      - name: Round-trip harness
        run: pnpm test:roundtrip

      - name: Server build
        run: pnpm build
